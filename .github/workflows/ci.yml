name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.18.x"
  GOPATH: ${{ github.workspace }}/go
  GO111MODULE: "off"
  REPO_PATH: ${{ github.workspace }}/go/src/github.com/mailhog/MailHog
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mailhog

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.REPO_PATH }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          path: go/src/github.com/mailhog/MailHog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check gofmt
        run: |
          files="$(gofmt -l main.go config test/perf vendor/github.com/mailhog)"
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Run unit tests
        run: |
          go test -timeout=60s ./...
          go test -timeout=60s github.com/mailhog/MailHog/vendor/github.com/mailhog/storage
          go test -timeout=60s github.com/mailhog/MailHog/vendor/github.com/mailhog/MailHog-Server/api
          go test -timeout=60s github.com/mailhog/MailHog/vendor/github.com/mailhog/smtp
          go test -timeout=60s github.com/mailhog/MailHog/vendor/github.com/mailhog/MailHog-Server/smtp

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mailhog-ci:${{ github.sha }} .

  perf-smoke:
    name: Performance smoke
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build image
        run: docker build -t mailhog-perf:${{ github.sha }} .

      - name: Start MailHog with 600MB memory limit
        run: |
          docker volume create mailhog-perf-maildir
          docker run --rm \
            -v mailhog-perf-maildir:/maildir \
            alpine:3 \
            sh -c 'chown -R 1000:1000 /maildir'
          docker run -d \
            --name mailhog-perf \
            --memory=600m \
            --memory-swap=600m \
            -p 127.0.0.1:18025:8025 \
            -p 127.0.0.1:11025:1025 \
            -e MH_STORAGE=maildir \
            -e MH_MAILDIR_PATH=/home/mailhog/maildir \
            -v mailhog-perf-maildir:/home/mailhog/maildir \
            mailhog-perf:${{ github.sha }}

      - name: Run performance smoke
        env:
          MAILHOG_HTTP_URL: http://127.0.0.1:18025
          MAILHOG_SMTP_ADDR: 127.0.0.1:11025
          MAILHOG_SMOKE_SMALL_MESSAGES: "20"
          MAILHOG_SMOKE_SMALL_BYTES: "1048576"
          MAILHOG_SMOKE_LARGE_MESSAGES: "3"
          MAILHOG_SMOKE_LARGE_ATTACHMENT_BYTES: "8388608"
          MAILHOG_SMOKE_RPS: "10"
          MAILHOG_SMOKE_DURATION: "10s"
          MAILHOG_SMOKE_MAX_COMPACT_BYTES: "2097152"
        run: go run ./test/perf/smoke.go

      - name: Check container health
        run: |
          test "$(docker inspect -f '{{.State.OOMKilled}}' mailhog-perf)" = "false"
          docker ps --filter name=mailhog-perf --filter status=running --format '{{.Names}}' | grep -q '^mailhog-perf$'

      - name: Dump MailHog logs
        if: failure()
        run: docker logs --tail=300 mailhog-perf || true

      - name: Clean up container
        if: always()
        run: |
          docker rm -f mailhog-perf || true
          docker volume rm mailhog-perf-maildir || true

  docker-publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs:
      - unit
      - perf-smoke
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
